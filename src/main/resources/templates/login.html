<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card">
                    <!-- Brand -->
                    <div class="text-center mb-4">
                        <span style="font-size:2.5rem;color:#FF385C;"><i class="bi bi-house-heart-fill"></i></span>
                        <h2 class="auth-title mt-2">Welcome back</h2>
                        <p class="auth-sub">Log in to your RentKaro account</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 small rounded-3">
                        <i class="bi bi-exclamation-circle me-1"></i> Invalid email or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 small rounded-3">
                        <i class="bi bi-check-circle me-1"></i> Logged out successfully.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success py-2 small rounded-3">
                        <i class="bi bi-check-circle me-1"></i> Account created! Please log in.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label-rk">Email</label>
                            <div class="input-wrap">
                                <i class="bi bi-envelope input-icon"></i>
                                <input type="email" name="email" class="form-control-rk"
                                       placeholder="you@example.com" required autocomplete="email">
                            </div>
                        </div>
                        <!-- Password -->
                        <div class="mb-4">
                            <label class="form-label-rk">Password</label>
                            <div class="input-wrap">
                                <i class="bi bi-lock input-icon"></i>
                                <input type="password" name="password" id="loginPw" class="form-control-rk"
                                       placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="toggle-pw" onclick="togglePw('loginPw', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn-rk btn w-100 btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Log in
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0 small">
                        Don't have an account?
                        <a th:href="@{/register}" class="fw-bold text-brand">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
function togglePw(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
