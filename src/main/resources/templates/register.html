<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-wrapper py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <span style="font-size:2.5rem;color:#FF385C;"><i class="bi bi-house-heart-fill"></i></span>
                        <h2 class="auth-title mt-2">Create your account</h2>
                        <p class="auth-sub">Join RentKaro as a Guest or Host</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger py-2 small rounded-3">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        <span th:text="${error}">Error</span>
                    </div>

                    <form th:action="@{/register}" method="post">
                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label-rk">Full Name</label>
                            <div class="input-wrap">
                                <i class="bi bi-person input-icon"></i>
                                <input type="text" name="name" class="form-control-rk"
                                       placeholder="John Doe" required minlength="2">
                            </div>
                        </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label-rk">Email</label>
                            <div class="input-wrap">
                                <i class="bi bi-envelope input-icon"></i>
                                <input type="email" name="email" class="form-control-rk"
                                       placeholder="you@example.com" required>
                            </div>
                        </div>
                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label-rk">Password</label>
                            <div class="input-wrap">
                                <i class="bi bi-lock input-icon"></i>
                                <input type="password" name="password" id="regPw" class="form-control-rk"
                                       placeholder="Min 6 characters" required minlength="6">
                                <button type="button" class="toggle-pw" onclick="togglePw('regPw', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Role -->
                        <div class="mb-4">
                            <label class="form-label-rk">I want to</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="role-card selected w-100" id="card-guest">
                                        <input type="radio" name="role" value="GUEST" checked onchange="selectRole('guest')">
                                        <div class="role-icon"><i class="bi bi-suitcase-lg text-brand"></i></div>
                                        <div>
                                            <div class="fw-bold small">Book Stays</div>
                                            <div class="text-muted" style="font-size:.75rem;">Guest</div>
                                        </div>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <label class="role-card w-100" id="card-host">
                                        <input type="radio" name="role" value="HOST" onchange="selectRole('host')">
                                        <div class="role-icon"><i class="bi bi-house-add text-brand"></i></div>
                                        <div>
                                            <div class="fw-bold small">List Property</div>
                                            <div class="text-muted" style="font-size:.75rem;">Host</div>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn-rk btn w-100 btn-lg">
                            <i class="bi bi-person-plus me-1"></i> Create Account
                        </button>
                    </form>

                    <p class="text-center mt-4 mb-0 small">
                        Already have an account?
                        <a th:href="@{/login}" class="fw-bold text-brand">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
function togglePw(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
function selectRole(role) {
    document.getElementById('card-guest').classList.toggle('selected', role === 'guest');
    document.getElementById('card-host').classList.toggle('selected', role === 'host');
}
</script>
</body>
</html>
