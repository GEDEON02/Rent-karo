<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Payments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between mb-4"><h3 class="fw-bold"><i class="bi bi-credit-card me-2"></i>Payments Overview</h3><a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">← Back</a></div>
    <div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-light"><tr><th>Transaction ID</th><th>Booking</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead>
        <tbody><tr th:each="p : ${payments}">
            <td class="fw-medium font-monospace" th:text="${p.transactionId}">TXN</td><td th:text="${p.bookingId}">Booking</td>
            <td>₹<span th:text="${#numbers.formatDecimal(p.amount, 0, 0)}">0</span></td><td th:text="${p.paymentMethod}">Method</td>
            <td><span class="badge rounded-pill" th:classappend="${p.status == 'PAID'} ? 'bg-success' : (${p.status == 'REFUNDED'} ? 'bg-warning text-dark' : 'bg-danger')" th:text="${p.status}">STATUS</span></td>
            <td th:text="${p.paidAt != null ? #temporals.format(p.paidAt, 'dd MMM yyyy HH:mm') : 'N/A'}">Date</td>
        </tr></tbody>
    </table></div>
    <div th:if="${payments == null || payments.isEmpty()}" class="text-center py-5">
        <i class="bi bi-credit-card" style="font-size:3rem;color:#ddd;"></i>
        <h5 class="mt-3 text-muted">No payments yet</h5>
        <p class="text-muted small">Payment records will appear here once bookings are made.</p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
