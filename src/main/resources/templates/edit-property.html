<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Property')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="fw-bold mb-4">Edit Property</h3>
            <div th:if="${error}" class="alert alert-danger"><span th:text="${error}">Error</span></div>
            <form th:action="@{'/dashboard/edit-property/' + ${property.id}}" method="post">
                <div class="card border-0 shadow-sm p-4 mb-3" style="border-radius:16px;">
                    <div class="mb-3"><label class="form-label fw-medium">Title *</label><input type="text" name="title" class="form-control" th:value="${property.title}" required></div>
                    <div class="mb-3"><label class="form-label fw-medium">Description *</label><textarea name="description" class="form-control" rows="3" required th:text="${property.description}"></textarea></div>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Price/Night (₹)</label><input type="number" name="pricePerNight" class="form-control" th:value="${property.pricePerNight}" required></div>
                        <div class="col-md-4"><label class="form-label">City</label><input type="text" name="city" class="form-control" th:value="${property.city}"></div>
                        <div class="col-md-4"><label class="form-label">Country</label><input type="text" name="country" class="form-control" th:value="${property.country}"></div>
                    </div>
                </div>
                <div class="card border-0 shadow-sm p-4 mb-3" style="border-radius:16px;">
                    <div class="mb-3"><label class="form-label">Address</label><input type="text" name="location" class="form-control" th:value="${property.location}" required></div>
                    <div class="row g-3">
                        <div class="col-4"><label class="form-label">Max Guests</label><input type="number" name="maxGuests" class="form-control" th:value="${property.maxGuests}"></div>
                        <div class="col-4"><label class="form-label">Bedrooms</label><input type="number" name="numBedrooms" class="form-control" th:value="${property.numBedrooms}"></div>
                        <div class="col-4"><label class="form-label">Bathrooms</label><input type="number" name="numBathrooms" class="form-control" th:value="${property.numBathrooms}"></div>
                    </div>
                </div>
                <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius:16px;">
                    <div class="mb-3"><label class="form-label">Amenities</label><input type="text" name="amenities" class="form-control" th:value="${property.amenities != null ? #strings.listJoin(property.amenities, ', ') : ''}"></div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Property Images</label>
                        <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Paste one image URL per line.</p>
                        <textarea name="imageUrls" class="form-control" rows="3" th:text="${property.images != null ? #strings.listJoin(property.images, '\n') : ''}"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-rk btn-lg w-100">Update Property</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
