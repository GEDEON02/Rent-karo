spring.application.name=RentKaro

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentkaro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=RentKaroSuperSecretKeyForJWTTokenGenerationAndValidation2025SecureKey
jwt.expiration=86400000

# Server Configuration
server.port=8080
server.address=127.0.0.1

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Thymeleaf
spring.thymeleaf.cache=false
