<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Listings')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between mb-4"><h3 class="fw-bold"><i class="bi bi-houses me-2"></i>Listings Management</h3><a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">← Back</a></div>
    <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
    <div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-light"><tr><th>Title</th><th>Host</th><th>City</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody><tr th:each="p : ${properties}">
            <td class="fw-medium"><a th:href="@{'/properties/' + ${p.id}}" class="text-decoration-none text-dark fw-bold" th:text="${p.title}">Title</a></td>
            <td th:text="${p.hostName}">Host</td><td th:text="${p.city}">City</td>
            <td>₹<span th:text="${p.pricePerNight != null ? #numbers.formatDecimal(p.pricePerNight, 0, 0) : '0'}">0</span></td>
            <td><span class="badge rounded-pill" th:classappend="${p.approvalStatus == 'APPROVED'} ? 'bg-success' : (${p.approvalStatus == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')" th:text="${p.approvalStatus}">STATUS</span></td>
            <td><div class="d-flex gap-1 flex-wrap">
                <a th:href="@{'/properties/' + ${p.id}}" class="btn btn-sm btn-outline-info" title="View"><i class="bi bi-eye"></i></a>
                <form th:action="@{'/admin/approve-property/' + ${p.id}}" method="post"><button class="btn btn-sm btn-outline-success" th:disabled="${p.approvalStatus == 'APPROVED'}">Approve</button></form>
                <form th:action="@{'/admin/reject-property/' + ${p.id}}" method="post"><button class="btn btn-sm btn-outline-warning" th:disabled="${p.approvalStatus == 'REJECTED'}">Reject</button></form>
                <form th:action="@{'/admin/delete-property/' + ${p.id}}" method="post" onsubmit="return confirm('Delete?')"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
            </div></td>
        </tr></tbody>
    </table></div>
    <div th:if="${properties == null || properties.isEmpty()}" class="text-center py-5">
        <i class="bi bi-houses" style="font-size:3rem;color:#ddd;"></i>
        <h5 class="mt-3 text-muted">No listings found</h5>
        <p class="text-muted small">No properties have been submitted yet.</p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
