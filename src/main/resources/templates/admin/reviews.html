<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Reviews')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="d-flex justify-content-between mb-4"><h3 class="fw-bold"><i class="bi bi-star me-2"></i>Reviews Management</h3><a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">← Back</a></div>
    <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
    <div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-light"><tr><th>Listing</th><th>Guest</th><th>Rating</th><th>Comment</th><th>Actions</th></tr></thead>
        <tbody><tr th:each="r : ${reviews}">
            <td><a th:href="@{'/properties/' + ${r.listingId}}" class="text-decoration-none text-dark fw-bold" th:text="${r.listingTitle}">Listing</a></td><td th:text="${r.guestName}">Guest</td>
            <td><span class="text-warning" th:each="i : ${#numbers.sequence(1, r.rating)}"><i class="bi bi-star-fill"></i></span></td>
            <td style="max-width:300px;" th:text="${r.comment}">Comment</td>
            <td><form th:action="@{'/admin/delete-review/' + ${r.id}}" method="post" onsubmit="return confirm('Delete review?')"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td>
        </tr></tbody>
    </table></div>
    <div th:if="${reviews == null || reviews.isEmpty()}" class="text-center py-5">
        <i class="bi bi-star" style="font-size:3rem;color:#ddd;"></i>
        <h5 class="mt-3 text-muted">No reviews yet</h5>
        <p class="text-muted small">Reviews will appear here once guests submit them.</p>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
