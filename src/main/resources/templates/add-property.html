<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Property')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h3 class="fw-bold mb-4">List Your Property</h3>
            <div th:if="${error}" class="alert alert-danger"><span th:text="${error}">Error</span></div>
            <form th:action="@{/dashboard/add-property}" method="post">
                <div class="card border-0 shadow-sm p-4 mb-3" style="border-radius:16px;">
                    <div class="mb-3"><label class="form-label fw-medium">Title *</label><input type="text" name="title" class="form-control" required minlength="3"></div>
                    <div class="mb-3"><label class="form-label fw-medium">Description *</label><textarea name="description" class="form-control" rows="3" required minlength="10"></textarea></div>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Price/Night (₹) *</label><input type="number" name="pricePerNight" class="form-control" required min="1"></div>
                        <div class="col-md-4"><label class="form-label">City</label><input type="text" name="city" class="form-control"></div>
                        <div class="col-md-4"><label class="form-label">Country</label><input type="text" name="country" class="form-control" value="India"></div>
                    </div>
                </div>
                <div class="card border-0 shadow-sm p-4 mb-3" style="border-radius:16px;">
                    <div class="mb-3"><label class="form-label">Full Address *</label><input type="text" name="location" class="form-control" required></div>
                    <div class="row g-3">
                        <div class="col-4"><label class="form-label">Max Guests</label><input type="number" name="maxGuests" class="form-control" min="1"></div>
                        <div class="col-4"><label class="form-label">Bedrooms</label><input type="number" name="numBedrooms" class="form-control" min="1"></div>
                        <div class="col-4"><label class="form-label">Bathrooms</label><input type="number" name="numBathrooms" class="form-control" min="1"></div>
                    </div>
                </div>
                <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius:16px;">
                    <div class="mb-3"><label class="form-label">Amenities (comma-separated)</label><input type="text" name="amenities" class="form-control" placeholder="WiFi, Pool, AC"></div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Property Images</label>
                        <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Paste one image URL per line (from Unsplash, Imgur, etc.)</p>
                        <textarea name="imageUrls" class="form-control" rows="3" placeholder="https://images.unsplash.com/photo-...&#10;https://images.unsplash.com/photo-..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-rk btn-lg w-100">List Property</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
