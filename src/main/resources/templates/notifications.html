<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-0"><i class="bi bi-bell me-2"></i>Notifications</h2>
                    <p class="text-muted mb-0" th:if="${unreadCount > 0}"><span th:text="${unreadCount}">0</span> unread</p>
                </div>
                <form th:if="${!notifications.isEmpty()}" th:action="@{/dashboard/notifications/read-all}" method="post">
                    <button type="submit" class="btn btn-rk-outline btn-sm"><i class="bi bi-check-all me-1"></i>Mark all as read</button>
                </form>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" style="border-radius:12px;"><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <div th:each="n : ${notifications}" class="card border-0 shadow-sm mb-2 p-3" th:classappend="${n.isRead != null && n.isRead} ? '' : 'border-start border-4'" th:styleappend="${n.isRead != null && n.isRead} ? '' : 'border-left-color: #FF385C !important;'" style="border-radius:12px;">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="d-flex align-items-start gap-3">
                        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" th:classappend="${n.isRead != null && n.isRead} ? 'bg-light' : ''" th:style="${n.isRead != null && n.isRead} ? 'width:40px;height:40px;' : 'width:40px;height:40px;background:rgba(255,56,92,.1);'">
                            <i class="bi bi-bell-fill" th:style="${n.isRead != null && n.isRead} ? 'color:#999;' : 'color:#FF385C;'"></i>
                        </div>
                        <div>
                            <p class="mb-1" th:classappend="${n.isRead != null && n.isRead} ? 'text-muted' : 'fw-medium'" th:text="${n.message}">Notification message</p>
                            <small class="text-muted" th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a') : ''}">Time</small>
                        </div>
                    </div>
                    <form th:if="${n.isRead == null || !n.isRead}" th:action="@{'/dashboard/notifications/' + ${n.id} + '/read'}" method="post">
                        <button type="submit" class="btn btn-sm btn-light" title="Mark as read"><i class="bi bi-check2"></i></button>
                    </form>
                </div>
            </div>

            <div th:if="${notifications.isEmpty()}" class="text-center py-5">
                <i class="bi bi-bell-slash" style="font-size:4rem;color:#ddd;"></i>
                <h5 class="mt-3 text-muted">No notifications yet</h5>
                <p class="text-muted">You'll be notified when something happens on your bookings or properties.</p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
