<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Wishlist')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-4">
    <h2 class="fw-bold mb-1"><i class="bi bi-heart-fill me-2" style="color:#FF385C;"></i>My Wishlist</h2>
    <p class="text-muted mb-4">Properties you've saved for later</p>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" style="border-radius:12px;"><span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <div class="row g-4">
        <div th:each="p : ${properties}" class="col-md-4 col-sm-6">
            <div class="card border-0 shadow-sm h-100 overflow-hidden card-hover" style="border-radius:16px;transition:transform .2s,box-shadow .2s;">
                <div style="position:relative;">
                    <a th:href="@{'/properties/' + ${p.id}}" class="text-decoration-none">
                        <img th:src="${p.images != null && !p.images.isEmpty() ? p.images.get(0) : 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=600'}" class="card-img-top" style="height:220px;object-fit:cover;" alt="Property">
                    </a>
                    <form th:action="@{'/dashboard/wishlist/toggle/' + ${p.id}}" method="post">
                        <button type="submit" class="wishlist-heart active" title="Remove from wishlist"><i class="bi bi-heart-fill"></i></button>
                    </form>
                    <span th:if="${p.averageRating > 0}" class="badge bg-white text-dark shadow-sm" style="position:absolute;top:12px;left:12px;border-radius:8px;">
                        <i class="bi bi-star-fill text-warning"></i> <span th:text="${p.averageRating}">4.5</span>
                    </span>
                </div>
                <div class="card-body">
                    <a th:href="@{'/properties/' + ${p.id}}" class="text-decoration-none">
                        <h6 class="fw-bold text-dark mb-1" th:text="${p.title}">Title</h6>
                        <p class="text-muted small mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${p.city != null ? p.city + ', ' + p.country : p.location}">Location</span></p>
                        <p class="fw-bold mb-0" style="color:#222;">₹<span th:text="${#numbers.formatDecimal(p.pricePerNight, 0, 0)}">5000</span> <span class="fw-normal text-muted small">/ night</span></p>
                    </a>
                </div>
            </div>
        </div>
        <div th:if="${properties.isEmpty()}" class="col-12 text-center py-5">
            <i class="bi bi-heart" style="font-size:4rem;color:#ddd;"></i>
            <h5 class="mt-3 text-muted">Your wishlist is empty</h5>
            <p class="text-muted">Start exploring and save properties you love!</p>
            <a th:href="@{/properties}" class="btn btn-rk mt-2"><i class="bi bi-search me-1"></i> Explore Properties</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
